$schema: https://git.drupalcode.org/project/drupal/-/raw/10.1.x/core/modules/sdc/src/metadata.schema.json
name: Page Footer
status: experimental
description: 'Component for the page footer.'
props:
  type: object
  properties:
    footer_attributes:
      type: Drupal\Core\Template\Attribute
      description: 'HTML attributes for the footer component.'
    footer_utility_classes:
      type: array
      items:
        type: string
      description: 'Additional utility classes to add to the footer.'
slots:
  footer_top:
    title: Footer Top
    description: 'The top section of the footer.'
  footer_middle:
    title: Footer Middle
    description: 'The middle section of the footer.'
  footer_bottom:
    title: Footer Bottom
    description: 'The bottom section of the footer.'
